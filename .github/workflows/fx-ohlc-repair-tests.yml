name: FX OHLC Repair Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/repair_market_ohlc.py"
      - "scripts/download_market_data.py"
      - "scripts/test_download_market_data_ohlc_preservation.py"
      - "scripts/production_market_scope.py"
      - "scripts/validate_market_data.py"
      - "scripts/test_production_market_scope.py"
      - "scripts/test_repair_market_ohlc.py"
      - ".github/workflows/fx-ohlc-repair-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-ohlc-repair-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Test OHLC repair guard
        run: python scripts/test_repair_market_ohlc.py
      - name: Test production market scope
        run: python scripts/test_production_market_scope.py
      - name: Test source OHLC preservation
        run: python scripts/test_download_market_data_ohlc_preservation.py
