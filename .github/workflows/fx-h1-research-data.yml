name: FX H1 research data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/download_h1_research_data.py"
      - ".github/workflows/fx-h1-research-data.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: fx-h1-research
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas
      - name: Download H1 research data
        run: python scripts/download_h1_research_data.py
      - name: Commit H1 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/h1/
          git diff --cached --quiet || git commit -m "data: add H1 research candles"
          git push
