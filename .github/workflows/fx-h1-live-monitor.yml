name: FX H1 Live Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fx-h1-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Record research revision
        run: git rev-parse HEAD

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh H1 market data
        run: |
          set +e
          python -m pip install pandas
          python research/h1/scripts/download_h1_live.py 2>&1 | tee /tmp/h1-refresh.log
          rc=${PIPESTATUS[0]}
          exit $rc

      # H4/D1 are rebuilt from the freshly refreshed H1 source; no second market-data request.
      # source-of-truth refresh
      - name: Refresh live H4/D1 context
        run: |
          set +e
          python research/h1/scripts/download_htf_live.py 2>&1 | tee /tmp/htf-refresh.log
          rc=${PIPESTATUS[0]}
          exit $rc

      - name: Evaluate frozen H1 v1 candidates
        run: |
          set +e
          python -m pip install pandas pyarrow
          python research/h1/scripts/monitor_h1_live.py 2>&1 | tee /tmp/h1-monitor.log
          rc=${PIPESTATUS[0]}
          cp /tmp/h1-monitor.log reports/h1_monitor_last.log
          exit $rc

      - name: Publish H1 state
        if: success()
        run: |
          git config user.name "fx-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/h1_live_positions.csv reports/h1_live_alerts.csv reports/h1_monitor_last.log
          git diff --cached --quiet || git commit -m "h1bot: refresh live state"
          git push origin HEAD:fx-h1-research

      - name: Publish durable H1 alert issues
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os, urllib.request
          p="reports/h1_live_alerts.csv"
          if not os.path.exists(p):
              raise SystemExit(0)
          token=os.environ["GITHUB_TOKEN"]
          repo=os.environ["GITHUB_REPOSITORY"]
          base=f"https://api.github.com/repos/{repo}"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","Content-Type":"application/json"}
          req=urllib.request.Request(base+"/issues?state=all&per_page=100",headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              existing=json.load(r)
          titles={x.get("title") for x in existing if "pull_request" not in x}
          with open(p,newline="") as f:
              rows=list(csv.DictReader(f))
          for row in rows:
              title=f"FX H1 ALERT {row['alert_id']}"
              if title in titles:
                  continue
              body=("## FX H1 alert\n\n"
                    f"- Kind: {row['kind']}\n"
                    f"- Pair: {row['pair']}\n"
                    f"- Direction: {row['direction'].upper()}\n"
                    f"- Signal time: {row['signal_time']}\n"
                    f"- Entry time: {row['entry_time']}\n"
                    f"- Price: {row['price']}\n"
                    f"- TP: {row['tp']}\n"
                    f"- SL: {row['sl']}\n\n"
                    f"{row['message']}\n\n"
                    "Research/notification only. No broker order is executed.")
              payload=json.dumps({"title":title,"body":body}).encode()
              req=urllib.request.Request(base+"/issues",data=payload,headers=headers,method="POST")
              with urllib.request.urlopen(req,timeout=30) as resp:
                  resp.read()
              titles.add(title)

      - name: Publish diagnostic issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=""
          if [ -f /tmp/h1-monitor.log ]; then log="/tmp/h1-monitor.log"; fi
          if [ -z "$log" ] && [ -f /tmp/htf-refresh.log ]; then log="/tmp/htf-refresh.log"; fi
          if [ -z "$log" ] && [ -f /tmp/h1-refresh.log ]; then log="/tmp/h1-refresh.log"; fi
          if [ -z "$log" ]; then exit 0; fi
          {
            echo "## H1 monitor failure"
            echo
            echo "- Workflow run: ${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo '```text'
            tail -n 120 "$log"
            echo '```'
          } > /tmp/h1-failure.md
          gh issue create --title "FX H1 monitor failure ${{ github.run_id }}" --body-file /tmp/h1-failure.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-live-state
          path: |
            reports/h1_live_positions.csv
            reports/h1_live_alerts.csv
            reports/h1_monitor_last.log
          if-no-files-found: ignore

# trigger corrected research branch
# runtime source is main; live state is published separately
# trigger after HTF timestamp fix
