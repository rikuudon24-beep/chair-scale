name: FX H1 Live Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fx-h1-live-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Record research revision
        run: git rev-parse HEAD

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh H1 market data
        run: |
          set +e
          python -m pip install pandas
          python research/h1/scripts/download_h1_live.py 2>&1 | tee /tmp/h1-refresh.log
          rc=${PIPESTATUS[0]}
          exit $rc

      # H4/D1 are rebuilt from the freshly refreshed H1 source; no second market-data request.
      # source-of-truth refresh
      - name: Refresh live H4/D1 context
        run: |
          set +e
          python research/h1/scripts/download_htf_live.py 2>&1 | tee /tmp/htf-refresh.log
          rc=${PIPESTATUS[0]}
          exit $rc

      - name: Restore persisted H1 position and alert state
        run: |
          set -euo pipefail
          git fetch origin fx-h1-research:refs/remotes/origin/fx-h1-research
          mkdir -p reports
          for path in reports/h1_live_positions.csv reports/h1_live_alerts.csv; do
            if git cat-file -e "origin/fx-h1-research:$path" 2>/dev/null; then
              git show "origin/fx-h1-research:$path" > "$path"
              echo "[OK] Restored $path from fx-h1-research"
            else
              echo "[WARN] No persisted $path found; monitor will initialize it"
            fi
          done

      - name: Validate H1 universe and frozen live scope
        run: python scripts/validate_h1_monitor_inputs.py

      - name: Evaluate frozen H1 v1 candidates
        run: |
          set +e
          python -m pip install pandas pyarrow
          python research/h1/scripts/monitor_h1_live.py 2>&1 | tee /tmp/h1-monitor.log
          rc=${PIPESTATUS[0]}
          cp /tmp/h1-monitor.log reports/h1_monitor_last.log
          exit $rc

      - name: Publish H1 state
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.parse, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          branch = "fx-h1-research"
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          files = [
              "reports/h1_live_positions.csv",
              "reports/h1_live_alerts.csv",
              "reports/h1_monitor_last.log",
          ]

          ref = api("GET", f"/git/ref/heads/{urllib.parse.quote(branch, safe='')}")
          parent = ref["object"]["sha"]
          commit = api("GET", f"/git/commits/{parent}")
          tree_entries = []
          changed = False

          for path in files:
              with open(path, "rb") as f:
                  local = f.read()
              try:
                  remote = api(
                      "GET",
                      f"/contents/{urllib.parse.quote(path, safe='/')}?ref={urllib.parse.quote(branch, safe='')}",
                  )
                  remote_bytes = base64.b64decode(remote["content"].replace("\\n", ""))
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      remote_bytes = None
                  else:
                      raise

              if remote_bytes != local:
                  changed = True
              tree_entries.append({
                  "path": path,
                  "mode": "100644",
                  "type": "blob",
                  "content": local.decode("utf-8"),
              })

          if not changed:
              print("H1 state unchanged; no publish commit needed.")
              raise SystemExit(0)

          tree = api("POST", "/git/trees", {
              "base_tree": commit["tree"]["sha"],
              "tree": tree_entries,
          })
          new_commit = api("POST", "/git/commits", {
              "message": "h1bot: refresh live state",
              "tree": tree["sha"],
              "parents": [parent],
          })
          api(
              "PATCH",
              f"/git/refs/heads/{urllib.parse.quote(branch, safe='')}",
              {"sha": new_commit["sha"], "force": False},
          )
          print("Published H1 state:", new_commit["sha"])
          PY

      - name: Publish durable H1 alert issues
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os, urllib.request
          p="reports/h1_live_alerts.csv"
          if not os.path.exists(p):
              raise SystemExit(0)
          token=os.environ["GITHUB_TOKEN"]
          repo=os.environ["GITHUB_REPOSITORY"]
          base=f"https://api.github.com/repos/{repo}"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","Content-Type":"application/json"}
          # Read every issue page so alert de-duplication remains correct after 100+ alerts.
          existing=[]
          page=1
          while True:
              req=urllib.request.Request(
                  base+f"/issues?state=all&per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  batch=json.load(r)
              if not batch:
                  break
              existing.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          titles={x.get("title") for x in existing if "pull_request" not in x}
          with open(p,newline="") as f:
              rows=list(csv.DictReader(f))
          for row in rows:
              title=f"FX H1 ALERT {row['alert_id']}"
              if title in titles:
                  continue
              body=("## FX H1 alert\n\n"
                    f"- Kind: {row['kind']}\n"
                    f"- Pair: {row['pair']}\n"
                    f"- Direction: {row['direction'].upper()}\n"
                    f"- Signal time: {row['signal_time']}\n"
                    f"- Entry time: {row['entry_time']}\n"
                    f"- Price: {row['price']}\n"
                    f"- TP: {row['tp']}\n"
                    f"- SL: {row['sl']}\n\n"
                    f"{row['message']}\n\n"
                    "Research/notification only. No broker order is executed.")
              payload=json.dumps({"title":title,"body":body}).encode()
              req=urllib.request.Request(base+"/issues",data=payload,headers=headers,method="POST")
              with urllib.request.urlopen(req,timeout=30) as resp:
                  resp.read()
              titles.add(title)
          PY

      - name: Publish diagnostic issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=""
          if [ -f /tmp/h1-monitor.log ]; then log="/tmp/h1-monitor.log"; fi
          if [ -z "$log" ] && [ -f /tmp/htf-refresh.log ]; then log="/tmp/htf-refresh.log"; fi
          if [ -z "$log" ] && [ -f /tmp/h1-refresh.log ]; then log="/tmp/h1-refresh.log"; fi
          if [ -z "$log" ]; then exit 0; fi
          {
            echo "## H1 monitor failure"
            echo
            echo "- Workflow run: ${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo '```text'
            tail -n 120 "$log"
            echo '```'
          } > /tmp/h1-failure.md
          gh issue create --title "FX H1 monitor failure ${{ github.run_id }}" --body-file /tmp/h1-failure.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-live-state
          path: |
            reports/h1_live_positions.csv
            reports/h1_live_alerts.csv
            reports/h1_monitor_last.log
          if-no-files-found: ignore

# trigger corrected research branch
# runtime source is main; live state is published separately
# trigger after D1 freshness fix
