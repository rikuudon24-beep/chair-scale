name: FX Lifecycle Adapter Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fx_lifecycle_contract.py"
      - "scripts/reconcile_h4_exit_lifecycle.py"
      - "scripts/test_fx_lifecycle_contract.py"
      - "tests/test_reconcile_h4_exit_lifecycle.py"
      - "scripts/refresh_audnzd_h4_exit.py"
      - "scripts/audnzd_h4_exit_notifications.py"
      - "tests/test_audnzd_h4_refresh_freshness.py"
      - "tests/test_audnzd_h4_exit_notifications.py"
      - "research/h1/scripts/download_h1_live.py"
      - "scripts/download_h1_research_data.py"
      - "tests/test_h1_data_integrity.py"
      - "tests/test_h1_cache_fallback.py"
      - "research/h1/scripts/download_htf_live.py"
      - "tests/test_live_htf_resampling.py"
      - "research/h1/scripts/download_htf_live.py"
      - "tests/test_live_htf_resampling.py"
      - "scripts/acknowledge_fx_notification_outbox.py"
      - "scripts/test_notification_ack_semantics.py"
      - ".github/workflows/fx-position-exit-monitor.yml"
      - ".github/workflows/fx-h1-live-monitor.yml"
      - ".github/workflows/fx-lifecycle-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-lifecycle-adapter-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile lifecycle scripts
        run: python -m py_compile scripts/fx_lifecycle_contract.py scripts/reconcile_h4_exit_lifecycle.py scripts/acknowledge_fx_notification_outbox.py

      - name: Test shared lifecycle contract
        run: python scripts/test_fx_lifecycle_contract.py

      - name: Test notification acknowledgement semantics
        run: python scripts/test_notification_ack_semantics.py

      - name: Test H4 lifecycle adapter
        run: python tests/test_reconcile_h4_exit_lifecycle.py

      - name: Test H1 data integrity guards
        run: python tests/test_h1_data_integrity.py

      - name: Test AUDNZD H4 weekend freshness
        run: python tests/test_audnzd_h4_refresh_freshness.py

      - name: Test AUDNZD exit notification identity
        run: python tests/test_audnzd_h4_exit_notifications.py

      - name: Test H1 cache fallback
        run: python tests/test_h1_cache_fallback.py

      - name: Test live H4/D1 resampling
        run: python tests/test_live_htf_resampling.py
