name: FX Lifecycle Adapter Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/fx_lifecycle_contract.py"
      - "scripts/reconcile_h4_exit_lifecycle.py"
      - "scripts/repair_market_ohlc.py"
      - "scripts/test_fx_lifecycle_contract.py"
      - "scripts/test_repair_market_ohlc.py"
      - "tests/test_reconcile_h4_exit_lifecycle.py"
      - ".github/workflows/fx-lifecycle-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fx-lifecycle-adapter-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Test shared lifecycle contract
        run: python scripts/test_fx_lifecycle_contract.py

      - name: Test OHLC repair guard
        run: python scripts/test_repair_market_ohlc.py

      - name: Test H4 lifecycle adapter
        run: python tests/test_reconcile_h4_exit_lifecycle.py
