name: FX Notification Replay Test
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - run: pip install pandas numpy requests
    - run: python scripts/research_notification_replay.py
      
    - run: python scripts/research_cross_pair_entry_quality_2026_10_07.py
    - uses: actions/upload-artifact@v4
      with:
        name: notification-replay
        path: reports/notification_replay_*.csv
