name: FX Current Notification State

on:
  push:
    branches: [main]
    paths:
      - "scripts/download_market_data.py"
      - "scripts/repair_market_ohlc.py"
      - "scripts/validate_market_data.py"
      - "scripts/production_market_scope.py"
      - "scripts/monitor_notification_state.py"
      - "scripts/publish_notification_issues.py"
      - "config/market_data.json"
      - ".github/workflows/fx-current-notification-state.yml"
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  # Keep current-state runs independent; reconcile main-branch pushes below.
  group: fx-current-notification-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh market data
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/download_market_data.py --mode incremental --end "$(date -u -d '+1 day' +%F)" && python scripts/test_repair_market_ohlc.py && python scripts/repair_market_ohlc.py && python scripts/validate_market_data.py; then
              exit 0
            fi
            echo "Refresh/validation failed (attempt ${attempt}/3); retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Evaluate notification state
        run: |
          python -m pip install pandas numpy
          python scripts/monitor_notification_state.py

      - name: Publish refreshed data and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market reports/current_notification_state.csv reports/current_notification_candidates.csv reports/current_notification_alerts.csv
          # The append-only repair audit is created only when a repair occurs.
          if [ -f reports/market_data_ohlc_repairs.csv ]; then
            git add reports/market_data_ohlc_repairs.csv
          fi
          if git diff --cached --quiet; then
            echo "No market/state changes to commit."
          else
            git commit -m "chore: refresh FX notification state"
            # H4 may publish a report while this job is refreshing data. Rebase
            # non-conflicting updates and retry pushes; abort on real conflicts.
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                echo "Main-state rebase conflict; refusing to overwrite concurrent data." >&2
                exit 1
              fi
              if git push; then
                exit 0
              fi
              sleep $((attempt * 3))
            done
            echo "Could not publish refreshed FX state after 3 attempts" >&2
            exit 1
          fi

      - name: Publish durable alert issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python scripts/publish_notification_issues.py; then
              exit 0
            fi
            echo "Alert publication failed (attempt ${attempt}/3); retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: current-notification-state
          path: reports/current_notification_*.csv
