name: FX H1 Winrate Filter Mining
on:
  push:
    branches: [fx-h1-research]
    paths:
      - 'research/h1/scripts/winrate_filter_mining.py'
      - 'research/h1/results/datasets/**'
      - '.github/workflows/fx-h1-winrate-filter-mining.yml'
permissions:
  contents: write
jobs:
  mine:
    if: "!contains(github.event.head_commit.message, '[skip h1]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow
      - run: python research/h1/scripts/winrate_filter_mining.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/h1/results/H1_WINRATE_FILTER_MINING.csv research/h1/results/H1_WINRATE_FILTER_MINING.md
          git diff --cached --quiet || git commit -m 'research: persist H1 win-rate filter mining [skip h1]'
          git push
