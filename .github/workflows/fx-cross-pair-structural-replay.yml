name: FX Cross Pair Structural Replay
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_cross_pair_structural_replay_2026_10_08.py"
      - ".github/workflows/fx-cross-pair-structural-replay.yml"
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy
      - run: python scripts/research_cross_pair_structural_replay_2026_10_08.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cross_pair_structural_replay_*_2026-10-08.csv reports/cross_pair_structural_summary_*_2026-10-08.csv
          git diff --cached --quiet || git commit -m "Add cross-pair structural replay"
          git push
