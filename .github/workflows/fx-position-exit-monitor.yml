name: FX position exit monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/monitor_position_exit.py"
      - "scripts/refresh_usdcad_h4_for_exit.py"
      - "scripts/reconcile_h4_exit_lifecycle.py"
      - "scripts/acknowledge_fx_notification_outbox.py"
      - "scripts/fx_lifecycle_contract.py"
      - "tests/test_reconcile_h4_exit_lifecycle.py"
      - "config/active_positions.json"
      - ".github/workflows/fx-position-exit-monitor.yml"

# H1 and H4 serialize access to the shared lifecycle branch and outbox.
concurrency:
  group: fx-shared-lifecycle-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh USDCAD H4 market data
        run: python scripts/refresh_usdcad_h4_for_exit.py
      - name: Test exit-monitor freshness and weekend handling
        run: python tests/test_monitor_position_exit_freshness.py
      - name: Evaluate completed-H4 exits
        run: python scripts/monitor_position_exit.py

      - name: Restore common lifecycle ledgers
        run: |
          set -euo pipefail
          git fetch origin fx-h1-research:refs/remotes/origin/fx-h1-research
          for path in reports/fx_trade_lifecycle.csv reports/fx_notification_outbox.csv; do
            if git cat-file -e "origin/fx-h1-research:$path" 2>/dev/null; then
              git show "origin/fx-h1-research:$path" > "$path"
              echo "[OK] Restored $path from fx-h1-research"
            else
              echo "[WARN] No persisted $path found; adapter will initialize it"
            fi
          done

      - name: Reconcile H4 exit signals into common lifecycle
        run: |
          python scripts/test_fx_lifecycle_contract.py
          python tests/test_reconcile_h4_exit_lifecycle.py
          python scripts/reconcile_h4_exit_lifecycle.py
      - name: Report exit-monitor failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          EXISTING="$(gh issue list --repo "$REPO" --state open --search 'FX EXIT monitor failure in:title' --json number --jq 'length')"
          if [ "$EXISTING" -gt 0 ]; then
            echo "An open FX EXIT monitor failure issue already exists; avoiding duplicate alerts."
            exit 0
          fi
          gh issue create --repo "$REPO" \
            --title "FX EXIT monitor failure" \
            --body "The position exit monitor failed, so no reliable HOLD/EXIT result is available. Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Check the logs and refresh/validate market data. No orders are executed."
      - name: Persist UNKNOWN exit state after any failure
        if: failure()
        run: |
          set -euo pipefail
          python scripts/mark_position_exit_unknown.py "${{ github.run_id }}"
          # Discard a partial market-file refresh on a failed run; UNKNOWN must not be paired with unvalidated data.
          git checkout -- data/market/h4/usdcad.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/current_position_exit_state.csv reports/current_exit_monitor_failure.txt
          git diff --cached --quiet || git commit -m "monitor: mark FX exit state unknown"
          # Other scheduled workflows may update main concurrently; rebase and retry safely.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not push UNKNOWN exit state after 3 attempts" >&2
          exit 1
      - name: Publish exit alerts
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import csv, os, urllib.request, json
          p="reports/current_exit_alerts.csv"
          if not os.path.exists(p): raise SystemExit(0)
          token=os.environ["GITHUB_TOKEN"]; repo=os.environ["GITHUB_REPOSITORY"]
          base=f"https://api.github.com/repos/{repo}"
          headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","Content-Type":"application/json"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          existing=[]
          page=1
          while True:
              batch=get(base+f"/issues?state=all&per_page=100&page={page}")
              if not batch:
                  break
              existing.extend(batch)
              if len(batch)<100:
                  break
              page+=1
          titles={x.get("title") for x in existing if "pull_request" not in x}
          with open(p,newline="") as f:
              for r in csv.DictReader(f):
                  title=f"FX EXIT {r['pair']} {r['direction']} {r['exit_signal_timestamp']}"
                  if title in titles:
                      continue
                  body=(
                    "## FX exit alert\n\n"
                    f"- Pair: {r['pair']}\n"
                    f"- Position: {r['direction'].upper()}\n"
                    f"- Confirmed H4 exit signal: {r['exit_signal_timestamp']}\n"
                    f"- Signal close: {r['exit_signal_price']}\n"
                    f"- Condition: {r['exit_reason']}\n\n"
                    "This is a notification only. No order is executed."
                  )
                  req=urllib.request.Request(base+"/issues",data=json.dumps({"title":title,"body":body}).encode(),headers=headers,method="POST")
                  with urllib.request.urlopen(req,timeout=30) as resp: resp.read()
                  titles.add(title)
          PY
      - name: Acknowledge common outbox delivery
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/acknowledge_fx_notification_outbox.py

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/current_position_exit_state.csv reports/current_exit_alerts.csv data/market/h4/usdcad.csv
          git diff --cached --quiet || git commit -m "monitor: update FX position exit state and market data"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not push exit reports after 3 attempts" >&2
          exit 1

      - name: Persist common lifecycle ledgers
        if: success()
        run: |
          set -euo pipefail
          mkdir -p /tmp/fx-shared-state
          cp reports/fx_trade_lifecycle.csv /tmp/fx-shared-state/
          cp reports/fx_notification_outbox.csv /tmp/fx-shared-state/
          git fetch origin fx-h1-research:refs/remotes/origin/fx-h1-research
          # Remove local copies after saving them so branch checkout cannot fail on dirty/untracked files.
          rm -f reports/fx_trade_lifecycle.csv reports/fx_notification_outbox.csv
          git checkout -B fx-h1-research origin/fx-h1-research
          mkdir -p reports
          cp /tmp/fx-shared-state/fx_trade_lifecycle.csv reports/
          cp /tmp/fx-shared-state/fx_notification_outbox.csv reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/fx_trade_lifecycle.csv reports/fx_notification_outbox.csv
          if git diff --cached --quiet; then
            echo "Common lifecycle ledgers unchanged."
            exit 0
          fi
          git commit -m "h4bot: persist common FX lifecycle state"
          for attempt in 1 2 3; do
            git pull --rebase origin fx-h1-research
            if git push origin HEAD:fx-h1-research; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Could not persist common lifecycle ledgers after 3 attempts" >&2
          exit 1
