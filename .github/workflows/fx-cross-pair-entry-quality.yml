name: FX Cross Pair Entry Quality
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_cross_pair_entry_quality_2026_10_07.py"
      - "reports/notification_entry_quality_signals.csv"
      - ".github/workflows/fx-cross-pair-entry-quality.yml"
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python scripts/research_cross_pair_entry_quality_2026_10_07.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cross_pair_entry_quality_2026-10-07.csv reports/cross_pair_entry_quality_combinations_2026-10-07.csv
          git diff --cached --quiet || git commit -m "Add cross-pair entry quality research"
          git push
