name: FX H1 price-structure research

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"
  push:
    paths:
      - "scripts/research_price_structure_transition.py"
      - ".github/workflows/fx-h1-price-structure-research.yml"
      - "data/market/h1/**"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: fx-h1-price-structure-research
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt numpy
      - name: Preflight H1 inputs
        run: |
          python -m py_compile scripts/research_price_structure_transition.py
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root = Path("data/market/h1")
          files = sorted(root.glob("*.csv"))
          print("H1 files:", len(files))
          if len(files) != 12:
              raise SystemExit(f"expected 12 H1 pair files, found {len(files)}")
          for p in files:
              df = pd.read_csv(p, usecols=["timestamp"])
              print(p.name, len(df), df["timestamp"].min(), df["timestamp"].max())
              if len(df) < 1000:
                  raise SystemExit(f"too few rows: {p}")
      - name: Run H1 causal structure study
        env:
          FX_RESEARCH_TF: h1
        run: |
          /usr/bin/time -v python scripts/research_price_structure_transition.py
      - name: Verify H1 research reports
        run: |
          set -e
          for f in             reports/price_structure_transition_summary_h1.csv             reports/price_structure_transition_effects_h1.csv             reports/price_structure_transition_pair_robustness_h1.csv
          do
            test -s "$f"
            echo "verified: $f"
            wc -l "$f"
          done
      - name: Commit H1 research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/price_structure_transition_*_h1.csv
          git diff --cached --quiet || git commit -m "research: H1 price structure results"
          git push
      - name: Upload H1 reports
        uses: actions/upload-artifact@v4
        with:
          name: fx-h1-price-structure-research
          path: reports/price_structure_transition_*_h1.csv
