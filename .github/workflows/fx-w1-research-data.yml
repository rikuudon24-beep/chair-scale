name: FX weekly research data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/download_w1_research_data.py"
      - ".github/workflows/fx-w1-research-data.yml"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Download W1 research data
        run: python scripts/download_w1_research_data.py
      - name: Run causal price-structure study
        run: python scripts/research_price_structure_transition.py
      - name: Commit W1 data and research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/w1 reports/price_structure_transition_*.csv
          git diff --cached --quiet || git commit -m "research: weekly data and price structure results"
          git push
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: fx-price-structure-transition-research-w1
          path: reports/price_structure_transition_*.csv
